<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><title>Gamer News — Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:1080px;margin:55px auto;padding:0 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}.admin-head h1{font:700 34px 'Space Grotesk';margin:7px 0}.admin-panel{background:#11121a;border:1px solid #292b38;border-radius:12px;padding:24px;margin:18px 0}.admin-panel h2{font:700 20px 'Space Grotesk';margin:0 0 17px}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.admin-form label{font-size:11px;color:#aab0c0;font-weight:700}.admin-form input,.admin-form select,.admin-form textarea{display:block;width:100%;margin-top:6px;background:#090a10;color:white;border:1px solid #333647;border-radius:6px;padding:12px;outline:none}.admin-form textarea{min-height:130px;grid-column:1/-1}.admin-form .wide{grid-column:1/-1}.admin-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.admin-btn{border:0;border-radius:6px;background:#ed2459;color:white;padding:11px 17px;font-weight:800;cursor:pointer}.admin-btn.secondary{background:#272a38;color:#eee}.admin-list{display:grid;gap:10px}.admin-item{padding:13px;border:1px solid #303343;border-radius:7px;display:flex;align-items:center;justify-content:space-between;gap:15px}.admin-item small{display:block;color:#9ba2b4;margin-top:4px}.admin-item button{background:#282b38;color:#fff;border:1px solid #42465a;padding:8px 10px;border-radius:5px}.muted{color:#9299ab;font-size:12px}.hidden{display:none!important}.login-box{max-width:420px;margin:12vh auto}.login-box input{width:100%;margin:8px 0 14px;background:#090a10;color:white;border:1px solid #333647;border-radius:6px;padding:13px}.status{font-size:12px;color:#aab0c0;margin-top:12px;white-space:pre-wrap}.@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-form textarea,.admin-form .wide{grid-column:auto}.admin-head{align-items:flex-start;flex-direction:column}.admin-panel{padding:17px}}
 .pink{color:#d71920}.admin-panel{background:#fff;border-color:#e8e8e8;color:#171717}.admin-form label{color:#555}.admin-form input,.admin-form select,.admin-form textarea,.login-box input{background:#fff;color:#171717;border-color:#ddd}.admin-item{border-color:#eee}.admin-item small,.muted,.status{color:#777}.admin-item button,.admin-btn.secondary{background:#f5f5f5;color:#333;border-color:#ddd}.admin-btn{background:#d71920}.login-box{box-shadow:0 10px 30px #00000008} .pink{color:#d71920}</style></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">G</span><span>GAMER <b>NEWS</b></span></a><a class="sign" href="/">VIEW PUBLIC SITE ↗</a></header>
<main class="admin-wrap">
<section id="loginView" class="admin-panel login-box"><div class="eyebrow">PRIVATE CONTROL ROOM</div><h1>ADMIN <span class="pink">LOGIN.</span></h1><p class="muted">Sign in with the authorized Blox Cataloh admin account.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username" value="suprememuhsin@gmail.com"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="admin-btn" type="submit">SIGN IN ↗</button></form><p class="status" id="loginStatus"></p></section>
<section id="dashboard" class="hidden">
<div class="admin-head"><div><div class="eyebrow">PRIVATE CONTROL ROOM</div><h1>CONTENT <span class="pink">DASHBOARD.</span></h1><p class="muted" id="whoami"></p></div><button class="admin-btn secondary" id="logout">LOG OUT</button></div>
<section class="admin-panel"><h2 id="formHeading">Publish a game</h2><form id="gameForm" class="admin-form"><label>Game name<input name="name" required maxlength="80" placeholder="Blox Fruits"></label><label>Genre<select name="genre"><option>Action</option><option>Adventure</option><option>Horror</option><option>Social</option><option>RPG</option><option>Simulation</option></select></label><label>Roblox game URL<input name="roblox_url" type="url" placeholder="https://www.roblox.com/games/..."></label><label>Thumbnail image URL<input name="thumbnail_url" type="url" placeholder="https://..."></label><label class="wide">Short description<input name="description" maxlength="180" placeholder="Adventure · RPG"></label><label><input name="featured" type="checkbox" style="display:inline;width:auto"> Featured game</label><label><input name="published" type="checkbox" checked style="display:inline;width:auto"> Visible on public site</label><div class="wide admin-actions"><button class="admin-btn" type="submit">SAVE GAME</button><button class="admin-btn secondary" type="reset">CLEAR</button></div></form><p class="status" id="gameStatus"></p></section>
<section class="admin-panel"><h2>Games on the website</h2><div class="admin-list" id="gamesList"></div></section>
<section class="admin-panel"><h2>Publish a news article</h2><form id="articleForm" class="admin-form"><label>Headline<input name="title" required maxlength="120"></label><label>Category<select name="category"><option>Updates</option><option>Games</option><option>Community</option><option>Guides</option></select></label><label>Game<input name="game" maxlength="70" placeholder="Roblox"></label><label>Thumbnail URL<input name="thumbnail_url" type="url"></label><label class="wide">Short summary<input name="summary" maxlength="220" required></label><label class="wide">Article content<textarea name="content" required></textarea></label><div class="wide admin-actions"><button class="admin-btn" type="submit">PUBLISH ARTICLE</button></div></form><p class="status" id="articleStatus"></p></section>
<section class="admin-panel"><h2>Recent articles</h2><div class="admin-list" id="articlesList"></div></section>
</section></main>
<script type="module" src="admin.js"></script></body></html>
