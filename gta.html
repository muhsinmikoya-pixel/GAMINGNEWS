<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>GTA — GamersNews</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">GN</span><span>Gamers<span class="accent">News</span></span></a><nav><a href="index.html">Home</a><a  href="roblox.html">Roblox</a><a class="active" href="gta.html">GTA</a><a  href="minecraft.html">Minecraft</a></nav><button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button></header><main class="wrap"><section class="hero"><div><p class="eyebrow">ROCKSTAR · GAMERSNEWS</p><h1>GTA<br><span class="accent">Central.</span></h1><p class="muted">Grand Theft Auto news, updates and community talk.</p><a class="button" href="index.html">← Back to home</a></div><div class="hero-side"><span class="live-dot"></span> GAME COMMUNITY<div class="hero-big">GN</div><p class="muted small">The latest conversation starts here.</p></div></section><section class="section"><div class="section-head"><div><p class="eyebrow">COMMUNITY STORIES</p><h2>GTA news</h2></div><a class="text-btn" href="index.html#latest">View all news</a></div><div id="newsList" class="news-list"></div></section></main><footer><a class="brand" href="index.html"><span class="brand-mark">GN</span><span>Gamers<span class="accent">News</span></span></a><span class="muted small">Made for gamers. Community-powered.</span></footer><script>const originalRender=window.render;</script><script src="app.js"></script><script>const all=JSON.parse(localStorage.getItem('gamersnews_posts_v1')||'[]');const list=document.getElementById('newsList');const filtered=all.filter(p=>p.game==='GTA');if(list&&filtered.length){list.innerHTML=filtered.slice().reverse().map(p=>'<article class="news-item"><div><span class="meta">'+p.game+' · '+new Date(p.date).toLocaleDateString()+'</span><h3>'+String(p.title).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</h3><p>'+String(p.body).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</p><div class="actions"><span class="muted small">'+(p.likes||0)+' likes · '+(p.comments||[]).length+' comments</span></div></div></article>').join('')}else if(list){list.innerHTML='<div class="empty">No '+ 'GTA' +' stories yet. Publish one from the home page.</div>'}</script></body></html>
